
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | عایق فیروز</title>
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="stylesheet" href="./css/style1.css">
</head>
<body>
  <section class="intro" id="intro" aria-label="صفحه شروع">
    <div class="window-pattern" aria-hidden="true">
      <img src="./icons/site/bay-windows-svgfind-com.svg" alt="" class="window-mark m1">
      <img src="./icons/site/window-svgfind-com.svg" alt="" class="window-mark m2">
      <img src="./icons/site/door-svgfind-com.svg" alt="" class="window-mark m3">
      <img src="./icons/site/window-panes-svgfind-com.svg" alt="" class="window-mark m4">
      <img src="./icons/site/windows-10-svgfind-com.svg" alt="" class="window-mark m5">
      <img src="./icons/site/round-window-svgfind-com.svg" alt="" class="window-mark m6">
      <img src="./icons/site/large-windows-svgfind-com.svg" alt="" class="window-mark m7">
      <img src="./icons/site/window-sash-svgfind-com.svg" alt="" class="window-mark m8">
      <img src="./icons/site/bay-windows-svgfind-com.svg" alt="" class="window-mark m9">
    </div>
    <div class="brand" id="brand">
      <div class="brand-icon" aria-hidden="true"><img src="./icons/favicon.svg" alt=""></div>
      <div class="brand-copy">
        <div class="brand-name">عایق فیروز</div>
        <div class="brand-sub">طراحی درب و پنجره دوجداره</div>
      </div>
    </div>
    <div class="loader" id="loader" role="status" aria-label="در حال بارگذاری"></div>
  </section>
  <main class="page" id="page">
    <div class="window-pattern" aria-hidden="true">
      <img src="./icons/site/bay-windows-svgfind-com.svg" alt="" class="window-mark m1">
      <img src="./icons/site/window-svgfind-com.svg" alt="" class="window-mark m2">
      <img src="./icons/site/door-svgfind-com.svg" alt="" class="window-mark m3">
      <img src="./icons/site/window-panes-svgfind-com.svg" alt="" class="window-mark m4">
      <img src="./icons/site/windows-10-svgfind-com.svg" alt="" class="window-mark m5">
      <img src="./icons/site/round-window-svgfind-com.svg" alt="" class="window-mark m6">
      <img src="./icons/site/large-windows-svgfind-com.svg" alt="" class="window-mark m7">
      <img src="./icons/site/window-sash-svgfind-com.svg" alt="" class="window-mark m8">
      <img src="./icons/site/bay-windows-svgfind-com.svg" alt="" class="window-mark m9">
    </div>
    <section class="login-card">
      <div class="mini-brand">
        <div class="brand-icon" aria-hidden="true"><img src="./icons/favicon.svg" alt=""></div>
        <div class="brand-copy">
          <strong>عایق فیروز</strong>
          <div class="brand-sub">طراحی درب و پنجره دوجداره</div>
        </div>
      </div>
      <h1>ورود به حساب</h1>
      <p class="description">برای ادامه، شماره تلفن همراه خود را وارد کنید.</p>
      <form id="loginForm" novalidate>
        <label for="identity">شماره تلفن همراه</label>
        <input id="identity" name="identity" type="tel" inputmode="tel"
          autocomplete="tel" placeholder="مثلاً 09123456789" required>
        <p class="hint" id="hint">شماره تلفن خود را وارد کنید تا مراحل ورود را ادامه دهید.</p>
        <button class="submit" type="submit">ادامه</button>
        <div class="message" id="message" role="status" aria-live="polite" aria-atomic="true"></div>
      </form>
      <div class="footer">با ادامه دادن، شرایط استفاده از سرویس را می‌پذیرید.</div>
    </section>
  </main>
  <script src="./js/script.js"></script>
</body>
</html>
